name: Release

# 推送 v 开头的 tag（如 v0.1.0）时构建签名 APK 并发布 Release；
# 也支持在 Actions 页面手动触发，用于验证流水线而不发版。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: build signed apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # NDK 与 CMake 的版本写死在 gradle/libs.versions.toml，runner 预装的未必是这两个。
      # AGP 9 要求 Build Tools 最低 36.0.0。该入参按空格切分，必须写成一行，换行会被当成包名的一部分
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradle.properties 里有一条指向开发机 JDK 的 org.gradle.java.home，
      # runner 上没有该路径会直接报错，这里删掉，改用 setup-java 装好的 JDK 21
      - name: Drop machine-specific JDK path
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      # 版本号取自 tag（去掉前缀 v）；手动触发时用短 sha，避免拿分支名当版本号。
      # 版本号含 '-' 预发布段（如 v0.2.0-beta.1）时标记 Release 为预发布
      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
            echo "name=${name}" >> "$GITHUB_OUTPUT"
            if [[ "$name" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "name=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Release 正文：annotated tag 的 message 写到文件，作为正文上半；
      # 其下叠加 GitHub 按提交自动生成的变更列表。轻量 tag 没有 message 时仅自动生成。
      - name: Read tag message
        id: tagmsg
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # 浅拉取 tag 对象即可，不必把整个历史拉下来
          git fetch --quiet --depth=1 origin "+refs/tags/${tag}:refs/tags/${tag}"
          # annotated tag 的对象类型是 tag；轻量 tag 指向 commit，
          # 它的 %(contents) 会退化成提交说明，不能当发布说明用
          if [ "$(git cat-file -t "refs/tags/${tag}")" = "tag" ]; then
            msg=$(git for-each-ref --format='%(contents)' "refs/tags/${tag}")
          else
            msg=""
          fi
          if [ -n "${msg//[[:space:]]/}" ]; then
            printf '%s\n' "$msg" > release-notes.md
            echo "source=tag-message" >> "$GITHUB_OUTPUT"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify signature
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          # 原生库必须仍然按 16 KB 页对齐，避免 Android 16 上的兼容性弹窗
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -P 16 4 "$APK"

      - name: Rename artifact
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "WXCacheViewer-${GITHUB_REF_NAME}.apk"
          echo "APK=WXCacheViewer-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ env.APK }}
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK }}
          # tag message 在上、自动生成的变更列表在下；无 tag message 时只有后者
          body_path: ${{ steps.tagmsg.outputs.source == 'tag-message' && 'release-notes.md' || '' }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
